# Nginx TRÊN HOST của VPS (cài bằng apt, KHÔNG phải container), đứng trước docker-compose.vps.yml.
# Hướng dẫn: docs/deploy-vps.md mục 6.
#
#   sudo cp infra/vps/nginx-vsleuth.conf /etc/nginx/sites-available/vsleuth.conf
#   sudo ln -s /etc/nginx/sites-available/vsleuth.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vsleuth.id.vn -d api.vsleuth.id.vn
#
# File này CHỈ khai cổng 80. `certbot --nginx` tự sửa file ĐÃ CÀI ở /etc/nginx/sites-available/
# (thêm listen 443 + đường dẫn chứng chỉ + chuyển hướng 80 → 443). Vì vậy sau lần chạy certbot
# đầu tiên, bản trên VPS sẽ khác bản trong repo — đó là bình thường. Muốn sửa cấu hình về sau
# thì sửa trực tiếp bản trên VPS, đừng chép đè bản repo lên (sẽ mất phần HTTPS).
#
# Vì sao Nginx ở host thay vì trong compose: certbot cài bằng apt tự đăng ký lịch gia hạn
# (systemd timer) và tự reload Nginx — không có bài toán "Nginx cần chứng chỉ mới khởi động được,
# certbot cần Nginx chạy mới xin được chứng chỉ" như khi cả hai cùng nằm trong container.

# ---------- Frontend: https://vsleuth.id.vn ----------
server {
    listen 80;
    listen [::]:80;
    server_name vsleuth.id.vn;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- Backend: https://api.vsleuth.id.vn ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.vsleuth.id.vn;

    server_tokens off;

    # Mặc định của Nginx là 1 MB — upload zip mã nguồn nào cũng ăn 413 trước khi tới backend.
    # Phải khớp MAX_UPLOAD_SIZE (mặc định 100MB) của core-backend.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE của màn hình hỏi đáp (POST .../conversations/{id}/messages). Nginx mặc định GOM
        # response rồi mới gửi: tiến trình truy xuất của Agent sẽ đứng im rồi hiện ra một cục ở
        # cuối. Backend hiện KHÔNG gửi header `X-Accel-Buffering: no` (kế hoạch §1 điểm 5 ghi là
        # có, nhưng mã chưa làm — kiểm 18/11/2026), nên phải tắt buffering ở đây.
        proxy_buffering off;
        proxy_cache off;

        # Một lượt hỏi Agent gọi LLM nhiều vòng, kéo dài hàng chục giây (AGENT_TIMEOUT mặc định
        # 120s). Mặc định 60s của Nginx sẽ cắt ngang giữa chừng và người dùng chỉ thấy im lặng.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
