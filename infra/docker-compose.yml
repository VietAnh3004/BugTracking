# Chạy toàn bộ hệ thống trên một máy cho tiện phát triển và demo.
#
# Đây KHÔNG phải điều kiện để hệ thống hoạt động: mỗi service khởi động được
# đơn lẻ chỉ với biến môi trường của nó, và có thể deploy lên các server khác nhau.
# File này chỉ nối sẵn các biến đó lại với nhau.
#
#   cp .env.example .env    && docker compose up -d

name: evidence-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Lưu mã nguồn upload. Dùng object storage thay vì volume dùng chung để
  # core-backend không bị buộc nằm cùng máy với các service khác.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-backend:
    build:
      context: ../core-backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AGENT_SERVICE_URL: http://agent-service:8000
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-repositories}
      # Giới hạn upload: đều có mặc định trong application.yml, khai lại ở đây để chỉnh được khi
      # deploy mà không phải build lại image. MAX_UPLOAD_SIZE chặn byte thô của request; ba biến
      # UPLOAD_* chặn theo nội dung SAU khi giải nén (chống zip-bomb).
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-100MB}
      UPLOAD_MAX_FILES: ${UPLOAD_MAX_FILES:-20000}
      UPLOAD_MAX_UNCOMPRESSED_BYTES: ${UPLOAD_MAX_UNCOMPRESSED_BYTES:-524288000}
      UPLOAD_MAX_COMPRESSION_RATIO: ${UPLOAD_MAX_COMPRESSION_RATIO:-200}
      UPLOAD_MAX_STORED_FILE_BYTES: ${UPLOAD_MAX_STORED_FILE_BYTES:-2097152}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT15M}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-P14D}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${CORE_BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  agent-service:
    build:
      context: ../agent-service
      dockerfile: Dockerfile
    environment:
      CORE_API_URL: http://core-backend:8080
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
    ports:
      - "${AGENT_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      # Đây là URL trình duyệt gọi tới, KHÔNG phải hostname trong mạng docker.
      API_BASE_URL: ${API_BASE_URL}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      # 127.0.0.1 chứ KHÔNG phải localhost: nginx chỉ `listen 80` (IPv4), trong khi busybox wget
      # của alpine phân giải `localhost` sang IPv6 ::1 trước và KHÔNG tự thử lại IPv4 — kết quả là
      # "Connection refused" và container bị đánh dấu unhealthy vĩnh viễn, dù phục vụ request từ
      # ngoài hoàn toàn bình thường. Healthcheck của core-backend không dính vì `curl` tự fallback
      # sang IPv4, nên lỗi chỉ lộ ra ở đúng service này.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
