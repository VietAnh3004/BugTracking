# Không có giá trị thật nào trong file này — tất cả đến từ biến môi trường.
# Biến không có giá trị mặc định là biến bắt buộc: thiếu thì ứng dụng không khởi động được,
# thay vì chạy rồi lỗi mơ hồ lúc đang phục vụ request.
#
# Xem .env.example để biết danh sách biến đầy đủ.

spring:
  application:
    name: core-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Schema chỉ thay đổi qua Flyway. 'validate' để Hibernate báo lỗi ngay khi
      # entity và schema lệch nhau, thay vì tự ý sửa cấu trúc bảng.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:100MB}
      max-request-size: ${MAX_UPLOAD_SIZE:100MB}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    # Ngắn có chủ đích (15 phút): access token không thu hồi được (stateless), nên phải tự hết
    # hạn nhanh. Refresh token (JWT_REFRESH_EXPIRATION) mới là thứ giữ phiên đăng nhập sống —
    # nó thu hồi được (lưu hash trong DB) và bù lại thời hạn ngắn của access token.
    expiration: ${JWT_EXPIRATION:PT15M}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:P14D}
    issuer: ${JWT_ISSUER:datn-hust-evidence-agent}
  security:
    # Bí mật chia sẻ cho agent-service gọi /api/v1/tools/** — KHÔNG phải JWT (ADR 0005 điểm 2).
    service-token: ${SERVICE_TOKEN}
    bcrypt-strength: ${BCRYPT_STRENGTH:10}
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    bucket: ${STORAGE_BUCKET}
  upload:
    max-files: ${UPLOAD_MAX_FILES:20000}
    max-uncompressed-bytes: ${UPLOAD_MAX_UNCOMPRESSED_BYTES:524288000}
    max-compression-ratio: ${UPLOAD_MAX_COMPRESSION_RATIO:200}
    max-stored-file-bytes: ${UPLOAD_MAX_STORED_FILE_BYTES:2097152}
  agent:
    base-url: ${AGENT_SERVICE_URL}
    # Agent gọi LLM nhiều vòng nên một lượt suy luận có thể kéo dài hàng chục giây.
    timeout: ${AGENT_TIMEOUT:PT120S}
  sandbox:
    # TẮT mặc định có chủ đích: deploy lên môi trường không có Docker daemon vẫn khởi động bình
    # thường, và đường nạp artifact thủ công không phụ thuộc gì vào sandbox. Bật bằng
    # ANALYSIS_RUNNER=docker (xem docs/adr/0008-chay-analyzer-trong-docker-sandbox.md).
    runner: ${ANALYSIS_RUNNER:disabled}
    java-image: ${ANALYZER_JAVA_IMAGE:evidence/analyzer-java:latest}
    semgrep-image: ${ANALYZER_SEMGREP_IMAGE:evidence/analyzer-semgrep:latest}
    # Hàng rào thời gian tường cho MỖI pha. `mvn test` trên repo lớn có thể lâu, nhưng vô hạn thì
    # một test treo giữ container sống mãi.
    timeout: ${SANDBOX_TIMEOUT:PT15M}
    memory-bytes: ${SANDBOX_MEMORY_BYTES:2147483648}
    # Chặn fork bomb. Timeout KHÔNG chặn được kiểu này: máy chết trước khi timeout kịp nổ.
    pids-limit: ${SANDBOX_PIDS_LIMIT:512}
    cpus: ${SANDBOX_CPUS:2}

logging:
  level:
    vn.hust.datn.evidence: ${LOG_LEVEL:INFO}
