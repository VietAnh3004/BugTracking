# Cấu hình cho test dùng Testcontainers. datasource.url/username/password bị AbstractIntegrationTest
# ghi đè bằng @DynamicPropertySource (container sinh cổng ngẫu nhiên) — các giá trị dưới đây chỉ để
# thoả mãn placeholder bắt buộc của application.yml (CORS_ORIGINS, JWT_SECRET,...), không dùng thật.
spring:
  datasource:
    url: jdbc:postgresql://placeholder:5432/placeholder
    username: placeholder
    password: placeholder

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: test-only-secret-du-32-ky-tu-khong-dung-that
    expiration: PT15M
    refresh-expiration: P14D
    issuer: datn-hust-test
  security:
    service-token: test-only-service-token-du-32-ky-tu-khong-dung-that
    # 10 vòng BCrypt mất ~100ms/lần hash - nhân với hàng chục test đăng ký/đăng nhập sẽ cộng
    # dồn thành hàng chục giây. 4 vòng đủ chậm để chứng minh logic đúng, không đủ chậm để làm
    # người chạy test tưởng hạ tầng bị treo.
    bcrypt-strength: 4
  storage:
    endpoint: http://localhost:9000
    access-key: test
    secret-key: test
    bucket: test-bucket
  agent:
    base-url: http://localhost:8000
