# Cấu hình cho test dùng Testcontainers. datasource.url/username/password bị AbstractIntegrationTest
# ghi đè bằng @DynamicPropertySource (container sinh cổng ngẫu nhiên) — các giá trị dưới đây chỉ để
# thoả mãn placeholder bắt buộc của application.yml (CORS_ORIGINS, JWT_SECRET,...), không dùng thật.
spring:
  datasource:
    url: jdbc:postgresql://placeholder:5432/placeholder
    username: placeholder
    password: placeholder

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: test-only-secret-du-32-ky-tu-khong-dung-that
    expiration: PT15M
    refresh-expiration: P14D
    issuer: datn-hust-test
  admin:
    # Giá trị GIẢ chỉ cho test (AdminControllerTest khớp hai dòng này); không phải tài khoản thật nào.
    username: admin-test
    password: admin-test-pass-1
  security:
    service-token: test-only-service-token-du-32-ky-tu-khong-dung-that
    # 10 vòng BCrypt mất ~100ms/lần hash - nhân với hàng chục test đăng ký/đăng nhập sẽ cộng
    # dồn thành hàng chục giây. 4 vòng đủ chậm để chứng minh logic đúng, không đủ chậm để làm
    # người chạy test tưởng hạ tầng bị treo.
    bcrypt-strength: 4
  account:
    public-url: http://app.test.local
    # Gửi ĐỒNG BỘ ngay sau commit: test đọc được thư vừa gửi mà không phải chờ luồng khác. Thư đi
    # vào RecordingAccountMailer (TestStorageConfiguration), không bao giờ ra SMTP thật.
    mail-async: false
    # Bật Google với một Client ID giả — token do FakeGoogleIdTokenVerifier "kiểm", không gọi Google.
    google-client-id: test-client-id.apps.googleusercontent.com
  storage:
    endpoint: http://localhost:9000
    access-key: test
    secret-key: test
    bucket: test-bucket
  agent:
    # Cổng 1: không có gì nghe ⇒ mọi lời gọi THẬT tới agent-service thất bại NGAY, giống nhau ở mọi
    # máy. Trước đây là localhost:8000 — đúng cổng agent-service chạy trên máy dev, nên một test
    # quên mock (từ khi có embedding: mọi test nạp artifact) sẽ gọi trúng agent thật và TIÊU QUOTA
    # Gemini. Test nào cần agent thì mock AgentClient/EmbeddingClient tường minh.
    base-url: http://127.0.0.1:1
