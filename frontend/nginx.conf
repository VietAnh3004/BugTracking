server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Cấu hình runtime được entrypoint sinh lại mỗi lần container khởi động, nên tuyệt đối
    # không được cache — nếu không, trình duyệt sẽ giữ URL backend của môi trường cũ.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Tên file bundle có hash nội dung nên cache vĩnh viễn là an toàn.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: mọi đường dẫn không khớp file tĩnh đều trả về index.html để React Router xử lý.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
