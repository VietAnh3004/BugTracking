# Kế thừa toàn bộ rule mặc định của gitleaks, chỉ thêm một ngoại lệ.
#
# Lưu ý: với bộ rule hiện tại, gitleaks KHÔNG bắt các credential giả trong vulnshop
# ("admin123", khoá ký dạng chuỗi thường) vì chúng không đủ entropy và không khớp mẫu của
# nhà cung cấp nào. Khai báo allowlist ở đây là để phòng trước: nếu sau này case study cần
# thêm chuỗi trông giống khoá thật (AWS, GitHub token…) để thử khả năng phát hiện của công cụ,
# CI sẽ không đột ngột đỏ mà không rõ lý do.

[extend]
useDefault = true

[allowlist]
description = """
case-study/vulnshop cố tình chứa khoá bí mật và mật khẩu giả để sinh cảnh báo phân tích tĩnh.
Đây là dữ liệu thực nghiệm, không phải secret thật bị lộ — xem SEEDED.md mục TP-14, TP-15.

Chỉ loại trừ đúng thư mục case study và artifact mẫu. Mọi nơi khác vẫn được quét bình thường:
nới rộng phạm vi ở đây sẽ làm mất lưới an toàn chống lộ khoá API thật của agent-service.
"""
paths = [
    '''case-study/vulnshop/.*''',
    '''docs/samples/.*''',
]
