[project]
name = "agent-service"
version = "0.1.0"
description = "Evidence-grounded AI agent: retrieval, tool-use và citation-forced reasoning"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Provider cài theo nhu cầu: không bắt buộc có cả ba để chạy được service.
anthropic = ["anthropic>=0.42"]
openai = ["openai>=1.60"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "RUF",
    "ANN",       # bắt buộc type hint
]
ignore = [
    "ANN401",    # cho phép Any ở ranh giới với SDK của provider
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# SDK của các provider không có stub đầy đủ; chúng chỉ được dùng sau lớp LlmProvider.
[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
