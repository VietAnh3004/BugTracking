# Chặn lỗi rẻ tiền trước khi chúng vào lịch sử git.
#
# Cài một lần:  pip install pre-commit && pre-commit install
#
# Spotless của Java không nằm ở đây: gọi Maven mỗi lần commit quá chậm. Format Java được
# kiểm ở CI, còn khi lập trình thì dùng `mvn spotless:apply`.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Lưới an toàn cho khoá API. Quan trọng vì .env của agent-service chứa LLM_API_KEY.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^agent-service/
      - id: ruff-format
        files: ^agent-service/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/src/.*\.(ts|tsx|css)$
