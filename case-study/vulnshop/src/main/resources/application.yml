# H2 in-memory: case study tu chua, chay test khong can Docker hay cai dat gi them.
spring:
  application:
    name: vulnshop
  datasource:
    url: jdbc:h2:mem:vulnshop;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  sql:
    init:
      mode: always

server:
  port: 8090
