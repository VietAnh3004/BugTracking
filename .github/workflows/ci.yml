name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mỗi service chạy độc lập và chỉ khi thư mục của nó thay đổi: sửa frontend không phải
  # chờ Maven build, và ngược lại.
  core-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Kiểm tra format
        run: mvn -B spotless:check
      - name: Build và test
        run: mvn -B verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Đối chiếu evidence-model.md với artifact thật và V2 migration
        working-directory: .
        run: python docs/check-evidence-model.py

  agent-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Cài dependency
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Kiểm tra format
        run: ruff format --check src tests
      - name: Kiểm tra kiểu
        run: mypy src
      - name: Test
        # Test không gọi LLM thật: vừa tốn tiền vừa khiến kết quả không lặp lại được.
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Kiểm tra format
        run: npm run format:check
      - name: Build (bao gồm kiểm tra kiểu)
        run: npm run build

  # Case study là dữ liệu thực nghiệm, không phải mã sản phẩm — nhưng nó vẫn cần được canh.
  #
  # Chạy `mvn verify` một mình KHÔNG đủ: pom đặt testFailureIgnore=true (5 test hỏng là nguồn
  # FAILED_TEST và STACK_TRACE cho đồ án, không phải lỗi), nên vulnshop hỏng thế nào build cũng
  # xanh. Phải đối chiếu số liệu với expected-analysis.json mới phát hiện được hỏng hóc.
  case-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chạy 4 analyzer và đối chiếu số liệu
        # Script tự lo khác biệt Windows/Linux khi mount Docker. Semgrep dùng rule đã vendor
        # trong repo và chạy với --network=none nên kết quả không phụ thuộc registry.
        run: ./case-study/run-analysis.sh vulnshop --check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Quét secret bị commit nhầm
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
